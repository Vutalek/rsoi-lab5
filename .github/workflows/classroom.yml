name: GitHub Classroom Workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: classroom-${{ github.ref }}
  cancel-in-progress: false
env:
  FLIGHT_SERVICE_HOST: http://flight_service:8060
  TICKET_SERVICE_HOST: http://ticket_service:8070
  BONUS_SERVICE_HOST: http://bonus_service:8050
  FLIGHT_SERVICE_DB_PROTOCOL: postgresql+psycopg2
  FLIGHT_SERVICE_DB_USER: program
  FLIGHT_SERVICE_DB_PASSWORD: test
  FLIGHT_SERVICE_DB_PORT: "5432"
  FLIGHT_SERVICE_DB_NAME: flights
  TICKET_SERVICE_DB_PROTOCOL: postgresql+psycopg2
  TICKET_SERVICE_DB_USER: program
  TICKET_SERVICE_DB_PASSWORD: test
  TICKET_SERVICE_DB_PORT: "5432"
  TICKET_SERVICE_DB_NAME: tickets
  BONUS_SERVICE_DB_PROTOCOL: postgresql+psycopg2
  BONUS_SERVICE_DB_USER: program
  BONUS_SERVICE_DB_PASSWORD: test
  BONUS_SERVICE_DB_PORT: "5432"
  BONUS_SERVICE_DB_NAME: privileges
jobs:
  tests:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: |
          for service in flight_service ticket_service bonus_service; do
            (
              cd "$service"
              python -m pip install -r requirements.txt
              python -m pytest
            ) || exit 1
          done

  build:
    name: Build and push images
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        service:
          - gateway_service
          - flight_service
          - ticket_service
          - bonus_service
    
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rsoi-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/rsoi-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to Kubernetes
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.6

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Configure Cloud.ru access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          test -n "$KUBE_CONFIG"
          curl -fsSL https://github.com/cloud-ru-tech/cloudlogin/releases/download/v1.0.2/cloudlogin_Linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/cloudlogin.tar.gz"
          tar -xzf "$RUNNER_TEMP/cloudlogin.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/cloudlogin" /usr/local/bin/cloudlogin
          mkdir -p "$HOME/.kube"
          umask 077
          printf '%s\n' "$KUBE_CONFIG" > "$HOME/.kube/config"

      - name: Deploy Helm releases
        run: |
          helm upgrade --install rabbitmq helm/application -n rsoi \
            -f helm/values/rabbitmq.yaml --wait --timeout 5m

          for service in flight ticket bonus purchase-worker gateway; do
            helm upgrade --install "$service" helm/application -n rsoi \
              -f "helm/values/$service.yaml" \
              --set-string image.tag="$GITHUB_SHA" \
              --set-string ingress.className=traefik \
              --wait --timeout 5m
          done

  postman:
    name: Postman tests on Kubernetes
    needs: deploy
    runs-on: ubuntu-latest
    env:
      HAS_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v3

      - name: Set Gateway address
        run: sed -i 's|http://localhost:8080|http://37.44.196.161|g' postman/environment.json

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          # TODO insert your variant
          collection: postman/collection.json
          environment: postman/environment.json
          insecure: true
          envVar: |
            [
              {"key": "username", "value": ${{ toJSON(secrets.KEYCLOAK_USERNAME) }}},
              {"key": "password", "value": ${{ toJSON(secrets.KEYCLOAK_PASSWORD) }}},
              {"key": "clientSecret", "value": ${{ toJSON(secrets.KEYCLOAK_CLIENT_SECRET) }}}
            ]
          delayRequest: 100
          reporters: '[ "cli" ]'

      - uses: education/autograding@v1
        id: autograder
        continue-on-error: true

      - name: Github auto grader mark
        if: env.HAS_GOOGLE_API_KEY == 'true'
        uses: Romanow/google-sheet-autograder-marker@v1.0
        with:
          google_token: ${{secrets.GOOGLE_API_KEY}}
          sheet_id: "1xkgjUX6Qmk7rdJG-QPOToav-HWWtthJjnShIKnw3oIY"
          homework_number: 2
          user_column: 'D'
          column_offset: 'F'
          mark: "'+"

  tolerance:
    name: Fault tolerance tests on Kubernetes
    needs: postman
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.6

      - name: Configure Cloud.ru access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          test -n "$KUBE_CONFIG"
          curl -fsSL https://github.com/cloud-ru-tech/cloudlogin/releases/download/v1.0.2/cloudlogin_Linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/cloudlogin.tar.gz"
          tar -xzf "$RUNNER_TEMP/cloudlogin.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/cloudlogin" /usr/local/bin/cloudlogin
          mkdir -p "$HOME/.kube"
          umask 077
          printf '%s\n' "$KUBE_CONFIG" > "$HOME/.kube/config"

      - name: Install Newman
        run: npm install --global newman

      - name: Run fault tolerance tests
        shell: bash
        run: |
          sed -i 's|http://localhost:8080|http://37.44.196.161|g' v1/postman/environment.json
          replicas=$(kubectl -n rsoi get deployment bonus -o jsonpath='{.spec.replicas}')
          cleanup() {
            status=$?
            trap - EXIT
            kubectl -n rsoi scale deployment bonus --replicas="$replicas" || status=1
            kubectl -n rsoi rollout status deployment/bonus --timeout=3m || status=1
            exit "$status"
          }
          trap cleanup EXIT

          run_tests() {
            newman run v1/postman/collection.json --folder "$1" \
              --environment v1/postman/environment.json \
              --export-environment v1/postman/environment.json --delay-request 100
          }

          run_tests success
          for step in 1 2 3 4; do
            if (( step % 2 == 1 )); then
              kubectl -n rsoi scale deployment bonus --replicas=0
              kubectl -n rsoi wait --for=delete pod -l app.kubernetes.io/name=bonus --timeout=2m
            else
              kubectl -n rsoi scale deployment bonus --replicas="$replicas"
              kubectl -n rsoi rollout status deployment/bonus --timeout=3m
            fi
            run_tests "step$step"
          done
